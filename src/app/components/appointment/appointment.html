<!-- Overlay -->
<div class="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-sm flex items-center justify-center z-50 px-4">

  <div class="bg-white w-full max-w-2xl rounded-xl shadow-2xl p-6 md:p-8 relative animate-fadeIn">

    <!-- Close Button -->
    <button 
      (click)="closeModal()"
      class="absolute top-4 right-4 text-gray-600 hover:text-red-500 text-2xl">
      &times;
    </button>

    <!-- ================= SUCCESS SCREEN ================= -->
   <div *ngIf="isSuccess" class="text-center py-10">

  <div class="flex justify-center mb-6">
    <div class="w-20 h-20 rounded-full bg-green-100 flex items-center justify-center">
      <svg class="w-12 h-12 text-green-600" fill="none" stroke="currentColor" stroke-width="3"
           viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M5 13l4 4L19 7"/>
      </svg>
    </div>
  </div>

  <h2 class="text-2xl font-bold text-green-600">
    Appointment is 1 Step Away!
  </h2>

  <p class="text-gray-600 mt-3">
    Redirecting you to WhatsApp in 5 seconds...
  </p>

</div>

    <!-- ================= FORM ================= -->
     <!-- Custom Error Alert -->
<div *ngIf="showError"
     class="mb-4 md:col-span-2 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded text-center">
  {{ errorMessage }}
</div>

    <form *ngIf="!isSuccess"
          (ngSubmit)="submitForm()"
          class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <h2 class="text-2xl md:text-3xl font-bold text-blue-700 mb-4 md:col-span-2 text-center">
        Book Appointment
      </h2>

      <input type="text"
             placeholder="Full Name"
             [(ngModel)]="appointmentData.name"
             name="name"
             required
             class="border rounded px-4 py-2 focus:ring-2 focus:ring-blue-400 outline-none">

      <input type="number"
             placeholder="Age"
             [(ngModel)]="appointmentData.age"
             name="age"
             required
             class="border rounded px-4 py-2 focus:ring-2 focus:ring-blue-400 outline-none">

      <input type="text"
             placeholder="Address"
             [(ngModel)]="appointmentData.address"
             name="address"
             required
             class="border rounded px-4 py-2 md:col-span-2 focus:ring-2 focus:ring-blue-400 outline-none">

      <input type="date"
             [(ngModel)]="appointmentData.date"
             name="date"
             required
             class="border rounded px-4 py-2 focus:ring-2 focus:ring-blue-400 outline-none">

      <input type="time"
             [(ngModel)]="appointmentData.time"
             name="time"
             required
             class="border rounded px-4 py-2 focus:ring-2 focus:ring-blue-400 outline-none">

      <textarea
             placeholder="Describe your problem"
             [(ngModel)]="appointmentData.problem"
             name="problem"
             rows="3"
             required
             class="border rounded px-4 py-2 md:col-span-2 focus:ring-2 focus:ring-blue-400 outline-none">
      </textarea>

      <button type="submit"
              class="md:col-span-2 bg-blue-600 text-white py-3 rounded hover:bg-blue-700 transition font-semibold">
        Submit Appointment
      </button>

    </form>

  </div>
</div>
